# POI カテゴリ → PLATEAU 用途コードの対応表
#
# 用途コード（Building_usage.xml）:
#   401 業務施設 / 402 商業施設 / 403 宿泊施設 / 404 商業系複合施設
#   411 住宅 / 412 共同住宅 / 413 店舗等併用住宅 / 414 店舗等併用共同住宅
#   415 作業所併用住宅 / 421 官公庁施設 / 422 文教厚生施設
#   431 運輸倉庫施設 / 441 工場 / 451 農林漁業 / 452 供給処理施設
#   453 防衛 / 454 その他
#
# POI はその建物の「地上部・主たる顔」を表すことが多い。住宅系（411/412）は
# POI では基本つかめないため、POI からは主に 401/402/403/421/422/431 を当てる。
# 高層の複合ビルでは地上 POI が1階しか表さない点に注意（設計書の既知の限界）。

usage_labels:
  "401": 業務施設
  "402": 商業施設
  "403": 宿泊施設
  "411": 住宅
  "412": 共同住宅
  "421": 官公庁施設
  "422": 文教厚生施設
  "431": 運輸倉庫施設
  "441": 工場
  "452": 供給処理施設
  "454": その他

