# 判断に迷うカテゴリ（poi.py の実行末尾に一覧として報告する）
ambiguous:
  - category: "coworking / シェアオフィス（overture: corporate_or_business_office 等に紛れる）"
    note: "専有オフィス(401)か、賃貸・共用で商業寄り(402)か割れる。暫定 401。"
  - category: "民泊・短期貸し（overture: lodging / short_term, OSM: tourism=apartment）"
    note: "宿泊施設(403)か共同住宅(412)か。建物全体が住宅のこともあり暫定 403。"
  - category: "駐車場（overture: parking, OSM: amenity=parking）"
    note: "運輸倉庫(431)に寄せるか、建物用途ではなく付帯設備として除外するか。暫定 除外。"
  - category: "real_estate_service / estate_agent（不動産業）"
    note: "業務(401)だが、賃貸管理会社が共同住宅(412)の1階にいる例が多く用途を誤らせる。暫定 401。"
  - category: "rental_service / rental_kiosk / レンタル"
    note: "対象物により商業(402)〜運輸倉庫(431)。暫定 402。"
  - category: "atm / vending_machine / post_box（建物用途を表さない点）"
    note: "建物の主用途ではない付帯物。予測から除外する。"
  - category: "building=yes（OSM 建物の 115,246 件）"
    note: "用途情報なし。osm_building 予測から除外する。"

# 予測に使わない（付帯物・用途情報なし）
drop:
  overture: [atm, parking]
  osm_poi_tag: [amenity=parking, amenity=vending_machine, amenity=atm, amenity=bench, amenity=post_box, amenity=toilets, amenity=bicycle_rental]
  osm_building_value: [yes, roof, construction, garage, garages, carport, "no"]
